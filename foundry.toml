[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "vendor/=vendor/",
]

[fuzz]
runs = 256
seed = "0x5eed"

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[fmt]
line_length = 120
